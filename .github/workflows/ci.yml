name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (no torch)
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install fastapi "uvicorn[standard]" sse-starlette pydantic httpx pytest pytest-asyncio ruff
      - name: ruff
        run: python -m ruff check backend tests
      - name: pytest (unit only)
        run: python -m pytest -m "not integration"

  smoke:
    name: smoke (one-command-start path)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install runtime deps (no sae, no integration)
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install fastapi "uvicorn[standard]" sse-starlette pydantic
      - name: start server briefly (lazy: skip model load)
        run: |
          python -m backend --host 127.0.0.1 --port 8000 --lazy &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server is up"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health | tee /tmp/health.json
          curl -sf http://127.0.0.1:8000/api/models | tee /tmp/models.json
          kill $SERVER_PID || true
        shell: bash
